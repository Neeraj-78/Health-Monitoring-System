<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappls test</title>
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }
    #status {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: #fff; padding: 8px 12px; border-radius: 6px;
      font: 14px Arial, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }
  </style>
  <script src="https://sdk.mappls.com/map/sdk/web?v=3.0&access_token=bdovxvygaghpdtyjenqaeikjchrddfjydirq"></script>
</head>
<body>
  <div id="status">Loading Mappls...</div>
  <div id="map"></div>

  <script>
    const status = document.getElementById('status');
    const fallback = { lat: 12.9716, lng: 77.5946 };

    function showMap(center, label) {
      const map = new mappls.Map('map', { center: center, zoom: 14, geolocation: false });
      map.on('load', function () {
        new mappls.Marker({ map: map, position: center, popupHtml: '<b>' + label + '</b>' });
      });
    }

    window.addEventListener('load', function () {
      if (typeof mappls === 'undefined') {
        status.textContent = 'Mappls SDK did not load. Check the key in the script tag.';
        return;
      }
      status.textContent = 'Mappls loaded. Detecting your location...';

      navigator.geolocation.getCurrentPosition(
        function (p) {
          const c = { lat: p.coords.latitude, lng: p.coords.longitude };
          status.textContent = 'Location found: ' + c.lat.toFixed(4) + ', ' + c.lng.toFixed(4);
          showMap(c, 'You are here');
        },
        function () {
          status.textContent = 'Location unavailable. Showing Bengaluru.';
          showMap(fallback, 'Bengaluru');
        },
        { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
      );
    });
  </script>
</body>
</html>
