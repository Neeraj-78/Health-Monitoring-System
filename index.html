<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Monitoring Dashboard</title>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Leaflet.js for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: auto; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card h2 { margin-top: 0; font-size: 1.2em; color: #7f8c8d; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .value { font-size: 2.5em; font-weight: bold; margin: 10px 0; }
        .unit { font-size: 0.5em; color: #95a5a6; margin-left: 5px; }
        .status-ok { color: #27ae60; }
        .status-alert { color: #e74c3c; }
        .alert-box { background: #fde8e8; border-left: 5px solid #e74c3c; padding: 15px; margin-top: 20px; border-radius: 5px; display: none; }
        .alert-box h3 { margin: 0 0 10px 0; color: #c0392b; }
        .btn { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1em; }
        .btn:hover { background: #2980b9; }
        .btn-sm { background: #2ecc71; padding: 6px 12px; font-size: 0.9em; }
        .btn-sm:hover { background: #27ae60; }
        
        #mapStatus { text-align: center; margin-top: 15px; font-weight: bold; color: #2980b9; display: none; }
        #hospitalListContainer { display: none; margin-top: 20px; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hospital-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #ecf0f1; }
        .hospital-item:last-child { border-bottom: none; }
        .hospital-info h4 { margin: 0 0 5px 0; color: #2c3e50; }
        .hospital-info p { margin: 0; font-size: 0.85em; color: #7f8c8d; }

        #map { height: 400px; width: 100%; border-radius: 8px; margin-top: 20px; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 40px; border-radius: 12px; width: 300px; text-align: center; }
        .login-box input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        .login-box button { width: 100%; margin-top: 20px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Login Overlay -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2>Secure Login</h2>
            <p>Enter your Firebase credentials</p>
            <input type="email" id="email" placeholder="Email" value="neeraj347145@gmail.com">
            <input type="password" id="password" placeholder="Password">
            <button class="btn" onclick="login()">Login</button>
            <p id="loginError" style="color: red; font-size: 0.9em;"></p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div class="container" id="dashboard" style="display: none;">
        <h1>🏥 Health Monitoring Dashboard</h1>
        
        <div class="grid">
            <div class="card">
                <h2>Heart Rate</h2>
                <div class="value" id="hrValue">--<span class="unit">bpm</span></div>
            </div>
            <div class="card">
                <h2>SpO2</h2>
                <div class="value" id="spo2Value">--<span class="unit">%</span></div>
            </div>
            <div class="card">
                <h2>Temperature</h2>
                <div class="value" id="tempValue">--<span class="unit">°C</span></div>
            </div>
            <div class="card">
                <h2>Status</h2>
                <div class="value" id="statusValue">--</div>
            </div>
        </div>

        <!-- Alert Box -->
        <div id="alertBox" class="alert-box">
            <h3>⚠️ Medical Alert</h3>
            <p id="alertMessage"></p>
            <button class="btn" onclick="findNearbyHospitals()">📍 Find Nearby Hospitals</button>
        </div>

        <!-- Map Status, Hospital List & Map Container -->
        <div id="mapStatus">Searching for nearby hospitals...</div>
        
        <div id="hospitalListContainer">
            <h3 style="margin-top:0; color:#2c3e50;">Nearby Medical Facilities (Within 10km)</h3>
            <div id="hospitalList"></div>
        </div>

        <div id="map"></div>

        <!-- Historical Data Chart -->
        <div class="card" style="margin-top: 20px;">
            <h2>📈 Historical Data (From Google Sheets)</h2>
            <canvas id="historyChart"></canvas>
        </div>
    </div>

    <!-- Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCljiCoRIDtFqvZgSSiXPaZQHiaCyrptPs",
            authDomain: "health-monitoring-system-9b19f.firebaseapp.com",
            databaseURL: "https://health-monitoring-system-9b19f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "health-monitoring-system-9b19f",
            storageBucket: "health-monitoring-system-9b19f.firebasestorage.app",
            messagingSenderId: "1090603150131",
            appId: "1:1090603150131:web:5412c37733158cb741ec46"
        };

        const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbzuWC1DU3UnbNzLIaIYisQ1gGmax8g2as2aHE8HBi_1UjNtoR4JzmqZq-Beb0waj-x5bw/exec";

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const auth = getAuth(app);

        let chartInstance = null;
        let map = null;
        let userLat = null;
        let userLon = null;
        let alertCountToday = 0;
        let hospitalsLoaded = false;
        let cachedHospitals = [];
        let userMarker = null;
        let hospitalMarkers = [];

        window.login = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');

            try {
                await signInWithEmailAndPassword(auth, email, password);
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('dashboard').style.display = 'block';
                startDashboard();
            } catch (error) {
                errorEl.textContent = error.message;
            }
        };

        function startDashboard() {
            const dbRef = ref(database, '/readings');
            onValue(dbRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    updateUI(data);
                }
            });
            fetchHistory();
        }

        function updateUI(data) {
            document.getElementById('hrValue').innerHTML = `${data.hr || '--'}<span class="unit">bpm</span>`;
            document.getElementById('spo2Value').innerHTML = `${data.spo2 || '--'}<span class="unit">%</span>`;
            document.getElementById('tempValue').innerHTML = `${data.temp ? data.temp.toFixed(1) : '--'}<span class="unit">°C</span>`;
            
            const statusEl = document.getElementById('statusValue');
            const alertBox = document.getElementById('alertBox');
            const alertMsg = document.getElementById('alertMessage');

            const alertText = data.alertMsg || "Normal";
            
            if (alertText !== "Normal" && alertText !== "") {
                statusEl.textContent = "ALERT";
                statusEl.className = "value status-alert";
                alertBox.style.display = "block";
                alertMsg.textContent = `Reason: ${alertText}. Please take necessary action.`;
            } else {
                statusEl.textContent = "NORMAL";
                statusEl.className = "value status-ok";
                alertBox.style.display = "none";
            }
        }

        async function fetchHistory() {
            try {
                const response = await fetch(SHEETS_API_URL);
                const data = await response.json();

                if (!data || data.length === 0) return;

                const recentData = data.slice(-20);
                
                alertCountToday = 0;
                const today = new Date().toDateString();
                data.forEach(row => {
                    if (row['Alert Message'] && row['Alert Message'] !== 'Normal') {
                        const rowDate = new Date(row['Timestamp']).toDateString();
                        if (rowDate === today) {
                            alertCountToday++;
                        }
                    }
                });

                if (alertCountToday >= 8) {
                    document.getElementById('alertBox').style.display = "block";
                    document.getElementById('alertMessage').innerHTML = `⚠️ You have had <b>${alertCountToday} alerts</b> today! We strongly recommend visiting a hospital for a checkup.`;
                }

                renderChart(recentData);

            } catch (error) {
                console.error("Error fetching history:", error);
            }
        }

        function renderChart(data) {
            const labels = data.map(d => {
                const date = new Date(d.Timestamp);
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            });
            const hrData = data.map(d => d['Heart Rate (BPM)'] || 0);
            const spo2Data = data.map(d => d['SpO2 (%)'] || 0);

            const ctx = document.getElementById('historyChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Heart Rate (bpm)',
                            data: hrData,
                            borderColor: '#e74c3c',
                            backgroundColor: 'rgba(231, 76, 60, 0.1)',
                            tension: 0.3,
                            fill: true
                        },
                        {
                            label: 'SpO2 (%)',
                            data: spo2Data,
                            borderColor: '#3498db',
                            backgroundColor: 'rgba(52, 152, 219, 0.1)',
                            tension: 0.3,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: { mode: 'index', intersect: false },
                    scales: { y: { beginAtZero: false } }
                }
            });
        }

        // Haversine distance calculator in km
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return (R * c).toFixed(2);
        }

        // --- BROADER HOSPITAL & CLINIC SEARCH ROUTINE ---
        window.findNearbyHospitals = () => {
            const mapStatus = document.getElementById('mapStatus');
            const listContainer = document.getElementById('hospitalListContainer');
            
            mapStatus.style.display = 'block';

            if (hospitalsLoaded) {
                mapStatus.textContent = "Hospitals list already loaded.";
                listContainer.style.display = 'block';
                return;
            }

            mapStatus.textContent = "Getting your location... Please allow location access if prompted.";

            if (!navigator.geolocation) {
                mapStatus.textContent = "Error: Geolocation is not supported by your browser.";
                mapStatus.style.color = "red";
                return;
            }

            navigator.geolocation.getCurrentPosition(async (position) => {
                userLat = position.coords.latitude;
                userLon = position.coords.longitude;

                mapStatus.textContent = "Searching for nearby medical facilities within 10km...";

                // Expanded query to search hospitals, clinics, and healthcare facilities within 10km
                const query = `
                    [out:json][timeout:25];
                    (
                      node["amenity"="hospital"](around:10000,${userLat},${userLon});
                      way["amenity"="hospital"](around:10000,${userLat},${userLon});
                      relation["amenity"="hospital"](around:10000,${userLat},${userLon});
                      node["amenity"="clinic"](around:10000,${userLat},${userLon});
                      way["amenity"="clinic"](around:10000,${userLat},${userLon});
                      node["healthcare"="hospital"](around:10000,${userLat},${userLon});
                    );
                    out center;
                `;
                
                const url = `https://overpass.kumi.systems/api/interpreter?data=${encodeURIComponent(query)}`;

                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("API Server Busy");
                    
                    const result = await response.json();

                    if (!result.elements || result.elements.length === 0) {
                        mapStatus.textContent = "No hospitals or clinics found within 10km. Try checking browser location permissions.";
                        mapStatus.style.color = "orange";
                        return;
                    }

                    mapStatus.textContent = `Found ${result.elements.length} medical facilities nearby!`;
                    
                    // Process and sort results by distance
                    cachedHospitals = result.elements.map(el => {
                        const hLat = el.lat || (el.center ? el.center.lat : null);
                        const hLon = el.lon || (el.center ? el.center.lon : null);
                        const name = (el.tags && el.tags.name) ? el.tags.name : "Medical Center / Clinic";
                        
                        if (!hLat || !hLon) return null;
                        
                        const dist = calculateDistance(userLat, userLon, hLat, hLon);
                        return { name, lat: hLat, lon: hLon, distance: parseFloat(dist) };
                    }).filter(item => item !== null).sort((a, b) => a.distance - b.distance);

                    if (cachedHospitals.length === 0) {
                        mapStatus.textContent = "Found elements, but coordinates were invalid.";
                        return;
                    }

                    renderHospitalList();
                    hospitalsLoaded = true;

                } catch (error) {
                    console.error("Error fetching hospitals:", error);
                    mapStatus.textContent = "Error searching for hospitals. The free API is busy. Please try again in 10 seconds.";
                    mapStatus.style.color = "red";
                }

            }, (error) => {
                mapStatus.textContent = `Error: ${error.message}. Please check your browser's location permissions.`;
                mapStatus.style.color = "red";
            });
        };

        function renderHospitalList() {
            const listEl = document.getElementById('hospitalList');
            listEl.innerHTML = "";

            cachedHospitals.forEach((h, index) => {
                listEl.innerHTML += `
                    <div class="hospital-item">
                        <div class="hospital-info">
                            <h4>${index + 1}. ${h.name}</h4>
                            <p>Distance: <b>${h.distance} km</b> away</p>
                        </div>
                        <button class="btn btn-sm" onclick="viewMapFor(${h.lat}, ${h.lon}, '${h.name.replace(/'/g, "\\'")}')">📍 View Map</button>
                    </div>
                `;
            });

            document.getElementById('hospitalListContainer').style.display = 'block';
        }

        // Triggered when clicking "View Map" on a specific hospital
        window.viewMapFor = (lat, lon, name) => {
            const mapDiv = document.getElementById('map');
            mapDiv.style.display = 'block';
            mapDiv.scrollIntoView({ behavior: 'smooth' });

            if (!map) {
                map = L.map('map').setView([lat, lon], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);
            } else {
                map.setView([lat, lon], 15);
            }

            // Clear old user/hospital markers if any
            if (userMarker) map.removeLayer(userMarker);
            hospitalMarkers.forEach(m => map.removeLayer(m));
            hospitalMarkers = [];

            // Add user location pin
            userMarker = L.marker([userLat, userLon]).addTo(map).bindPopup("<b>Your Location</b>");

            // Add selected hospital pin and open popup
            const marker = L.marker([lat, lon]).addTo(map)
                .bindPopup(`<b>${name}</b><br>Medical Facility`)
                .openPopup();
            
            hospitalMarkers.push(marker);
        };
    </script>
</body>
</html>
